<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Patient &mdash; Acurist Portal</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/portal.css">
<style>
  .patient-h { display:flex; align-items:flex-start; gap:18px; flex-wrap:wrap; }
  .pname-mark { width:56px; height:56px; border-radius:50%; background:var(--teal-pale); color:var(--teal); font-family:var(--serif); font-size:22px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .meta-row { display:flex; gap:18px; flex-wrap:wrap; color:var(--gray-mid); font-size:13px; margin-top:6px; }
  .meta-row b { color:var(--charcoal); font-weight:600; }
  .info-grid { display:grid; grid-template-columns: 1fr 1fr; gap:10px 24px; padding:4px 0; font-size:13px; }
  .info-grid .k { color:var(--gray-mid); font-size:11px; font-weight:600; letter-spacing:0.4px; text-transform:uppercase; margin-bottom:2px; }
  .info-grid .v { color:var(--charcoal); font-weight:500; }
  .rf-row { display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid rgba(10,22,40,0.05); font-size:13px; }
  .rf-row:last-child { border-bottom:none; }
  .rf-row .lbl { color:var(--charcoal); }
  .rf-row .val { font-size:11.5px; font-weight:600; padding:3px 10px; border-radius:50px; }
  .rf-row .val.good { background:var(--green-pale); color:var(--green); }
  .rf-row .val.warn { background:var(--amber-pale); color:var(--amber); }
  .timeline { position:relative; padding-left:20px; }
  .timeline::before { content:''; position:absolute; left:5px; top:6px; bottom:6px; width:2px; background:rgba(10,22,40,0.08); }
  .tl-row { position:relative; padding:14px 0; display:grid; grid-template-columns: 1fr auto auto auto auto; gap:16px; align-items:center; }
  .tl-row::before { content:''; position:absolute; left:-19px; top:22px; width:12px; height:12px; border-radius:50%; background:white; border:2.5px solid var(--teal); }
  .tl-row.pending::before { border-color:var(--gray-mid); }
  .tl-row + .tl-row { border-top:1px solid rgba(10,22,40,0.05); }
  .tl-meta { font-family:var(--serif); font-size:15px; color:var(--navy); font-weight:700; }
  .tl-sub { font-size:11.5px; color:var(--gray-mid); margin-top:2px; }
  .num { font-family:var(--serif); font-weight:700; }
</style>
</head>
<body data-protected="1" data-page="patients">

<div class="app">

  <aside class="sidebar">
    <div class="sb-brand">
      <img src="../assets/acurist-logo-footer.png" alt="Acurist">
      <span class="sb-env">Sandbox</span>
    </div>
    <div class="sb-section">Workspace</div>
    <nav class="sb-nav">
      <a href="dashboard.html" data-tab="dashboard"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Dashboard</a>
      <a href="patients.html" data-tab="patients"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Patients</a>
      <a href="new-screen.html" data-tab="new-screen"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>New Screen</a>
      <a href="report.html?id=p001" data-tab="reports"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>Reports</a>
    </nav>
    <div class="sb-section">Practice</div>
    <nav class="sb-nav">
      <a href="settings.html?tab=billing" data-tab="billing"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>Billing</a>
      <a href="settings.html" data-tab="settings"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Settings</a>
      <a href="#" onclick="alert('Help center coming soon.');return false;"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>Help &amp; Support</a>
    </nav>
    <div class="sb-bottom">
      <div class="sb-org">
        <div class="sb-org-mark">PF</div>
        <div>
          <div class="sb-org-name">Pacific Family Medicine</div>
          <div class="sb-org-sub">3 providers &middot; San Diego</div>
        </div>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="tb-title"><a href="patients.html" style="color:var(--gray-mid); font-family:var(--sans); font-size:13.5px; font-weight:500;">&larr; Patients</a></div>
      <div class="tb-search"><input type="search" placeholder="Search patients, reports, MRN&hellip;"></div>
      <button class="tb-bell"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="dot"></span></button>
      <div class="tb-user" data-action="logout"><div class="tb-avatar">SC</div><div><div class="tb-user-name">Dr. Sarah Chen</div><div class="tb-user-role">Attending &middot; MD</div></div><span class="tb-caret">&#9662;</span></div>
    </header>

    <div class="page" id="patientPage"></div>
  </main>
</div>

<script src="assets/data.js"></script>
<script src="assets/session.js"></script>
<script>
(function(){
  const params = new URLSearchParams(location.search);
  const id = params.get('id') || 'p001';
  const p = ACURIST_PATIENTS.find(x => x.id === id) || ACURIST_PATIENTS[0];
  const last = latestScreen(p);
  const cat = riskCategory(last?.risk);
  const initials = (p.first[0]+p.last[0]).toUpperCase();
  const age = ageFromDOB(p.dob);
  const allMpi = (p.history||[]).filter(h => h.mpi != null);

  // === Longitudinal chart ===
  function chartSVG() {
    if (allMpi.length < 2) return '<div class="empty" style="padding:24px;"><h3>Not enough data yet</h3>Need two or more MCI Screens to plot a trajectory.</div>';
    const W = 720, H = 220, PAD_L = 36, PAD_R = 16, PAD_T = 24, PAD_B = 36;
    const x0 = PAD_L, y0 = H - PAD_B, x1 = W - PAD_R, y1 = PAD_T;
    const yMin = 40, yMax = 100;
    const xStep = (x1 - x0) / (allMpi.length - 1);
    function yOf(v) { return y0 - ((v - yMin) / (yMax - yMin)) * (y0 - y1); }
    const pts = allMpi.map((h, i) => ({ x: x0 + i*xStep, y: yOf(h.mpi), v: h.mpi, d: h.date }));
    const path = pts.map((p,i) => (i?'L':'M') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
    const fill = path + ` L${pts[pts.length-1].x.toFixed(1)},${y0} L${pts[0].x.toFixed(1)},${y0} Z`;
    // bands
    const healthyTop = yOf(100), healthyBot = yOf(85);
    const mildTop = yOf(85),    mildBot    = yOf(70);
    const concTop = yOf(70),    concBot    = yOf(40);
    // x labels: first, mid, last
    const labels = [pts[0], pts[Math.floor(pts.length/2)], pts[pts.length-1]];
    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;">
      <!-- bands -->
      <rect x="${x0}" y="${healthyTop}" width="${x1-x0}" height="${healthyBot-healthyTop}" fill="rgba(26,122,94,0.08)"/>
      <rect x="${x0}" y="${mildTop}"    width="${x1-x0}" height="${mildBot-mildTop}"    fill="rgba(201,123,10,0.08)"/>
      <rect x="${x0}" y="${concTop}"    width="${x1-x0}" height="${concBot-concTop}"    fill="rgba(176,54,74,0.08)"/>
      <!-- y axis ticks -->
      <g font-family="DM Sans" font-size="10" fill="#627082">
        ${[40,55,70,85,100].map(v => `<line x1="${x0-3}" x2="${x0}" y1="${yOf(v)}" y2="${yOf(v)}" stroke="#cdd6e0"/><text x="${x0-6}" y="${yOf(v)+3}" text-anchor="end">${v}</text>`).join('')}
        <line x1="${x0}" x2="${x1}" y1="${y0}" y2="${y0}" stroke="#cdd6e0"/>
      </g>
      <!-- band labels at right -->
      <g font-family="DM Sans" font-size="10" fill="#627082">
        <text x="${x1+2}" y="${(healthyTop+healthyBot)/2+3}" text-anchor="start" style="display:none"></text>
      </g>
      <!-- y-axis title -->
      <text x="${x0-30}" y="${(y0+y1)/2}" transform="rotate(-90 ${x0-30} ${(y0+y1)/2})" font-family="DM Sans" font-size="10" fill="#627082" text-anchor="middle">Memory Performance Index</text>
      <!-- line + fill -->
      <path d="${fill}" fill="rgba(27,108,168,0.10)"/>
      <path d="${path}" fill="none" stroke="#1B6CA8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- points -->
      <g fill="#1B6CA8">
        ${pts.map((p,i) => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${i===pts.length-1?5:3.5}" stroke="white" stroke-width="${i===pts.length-1?2:1.5}"/>`).join('')}
      </g>
      <!-- value labels for first + last -->
      <g font-family="Georgia" font-size="12" fill="#0A1628" font-weight="700">
        <text x="${pts[0].x}" y="${pts[0].y-10}" text-anchor="middle">${pts[0].v}</text>
        <text x="${pts[pts.length-1].x}" y="${pts[pts.length-1].y-10}" text-anchor="middle">${pts[pts.length-1].v}</text>
      </g>
      <!-- x labels -->
      <g font-family="DM Sans" font-size="10" fill="#627082">
        ${labels.map(p => `<text x="${p.x}" y="${y0+18}" text-anchor="middle">${formatDate(p.d)}</text>`).join('')}
      </g>
      <!-- legend swatches -->
      <g font-family="DM Sans" font-size="10" fill="#4A6080">
        <rect x="${x0}" y="${PAD_T-18}" width="10" height="10" fill="rgba(26,122,94,0.5)"/>
        <text x="${x0+14}" y="${PAD_T-9}">Healthy 85–100</text>
        <rect x="${x0+100}" y="${PAD_T-18}" width="10" height="10" fill="rgba(201,123,10,0.5)"/>
        <text x="${x0+114}" y="${PAD_T-9}">Mild 70–84</text>
        <rect x="${x0+190}" y="${PAD_T-18}" width="10" height="10" fill="rgba(176,54,74,0.5)"/>
        <text x="${x0+204}" y="${PAD_T-9}">Concerning &lt;70</text>
      </g>
    </svg>`;
  }

  // === Risk factor list ===
  const rfHTML = Object.entries(p.riskFactors).map(([k,v]) => `
    <div class="rf-row">
      <span class="lbl">${k}</span>
      <span class="val ${v}">${v === 'good' ? 'On track' : 'Needs attention'}</span>
    </div>
  `).join('');

  // === Screen timeline ===
  const tlHTML = [...p.history].reverse().map(h => {
    const c = riskCategory(h.risk);
    const stateText = h.status === 'pending' ? '<span class="pill pill-blue">Processing</span>'
                     : h.status === 'invited' ? '<span class="pill pill-gray">Invited</span>'
                     : h.status === 'flagged' ? '<span class="pill pill-amber">Flagged</span>'
                     : (h.mpi != null ? `<span class="pill ${c.cls}">${c.label}</span>` : '<span class="pill pill-gray">Done</span>');
    const isReport = h.status === 'completed' && h.mpi != null;
    return `<div class="tl-row ${h.status === 'pending' || h.status === 'invited' ? 'pending' : ''}">
      <div>
        <div class="tl-meta">${h.type}</div>
        <div class="tl-sub">${formatDate(h.date)}</div>
      </div>
      <div class="text-small text-mute">MPI</div>
      <div class="num" style="color:var(--navy); font-size:18px; min-width:38px; text-align:right;">${h.mpi ?? '—'}</div>
      ${stateText}
      <div style="text-align:right;">
        ${isReport ? `<a class="btn btn-secondary btn-sm" href="report.html?id=${p.id}&screen=${h.date}">View report</a>` : `<span class="text-small text-mute">&mdash;</span>`}
      </div>
    </div>`;
  }).join('');

  // === Render ===
  document.getElementById('patientPage').innerHTML = `
    <!-- patient header -->
    <div class="page-h">
      <div class="patient-h">
        <div class="pname-mark">${initials}</div>
        <div>
          <h1>${p.first} ${p.last}</h1>
          <div class="meta-row">
            <span><b>${age}y</b> &middot; ${p.sex === 'F' ? 'Female' : 'Male'}</span>
            <span>DOB <b>${formatDate(p.dob)}</b></span>
            <span>MRN <b>${p.mrn}</b></span>
            <span>Provider <b>${p.physician}</b></span>
            ${p.flagged ? '<span class="pill pill-amber">Needs action</span>' : '<span class="pill pill-green">Stable</span>'}
          </div>
        </div>
      </div>
      <div class="page-actions">
        <a class="btn btn-secondary" href="#" onclick="window.print();return false;">Print summary</a>
        <a class="btn btn-secondary" href="#" onclick="alert('Refer to specialist — coming soon.');return false;">Refer to specialist</a>
        <a class="btn btn-primary" href="new-screen.html?patient=${p.id}">+ Order screen</a>
      </div>
    </div>

    <div class="grid-2-3">
      <!-- LEFT -->
      <div class="stack">

        <!-- Trajectory -->
        <div class="card">
          <div class="card-h">
            <div>
              <h2>Cognitive trajectory</h2>
              <div class="card-sub">Memory Performance Index across ${allMpi.length} screens</div>
            </div>
            <div class="flex-row">
              ${allMpi.length>=2 ? `<span class="pill pill-${(allMpi[allMpi.length-1].mpi < allMpi[0].mpi) ? 'amber' : 'green'}">${allMpi[allMpi.length-1].mpi - allMpi[0].mpi > 0 ? '+' : ''}${allMpi[allMpi.length-1].mpi - allMpi[0].mpi} since baseline</span>` : ''}
            </div>
          </div>
          <div class="card-b">
            ${chartSVG()}
            <div class="text-small text-mute mt-2">An MPI that drops three points or more between annual screens is a clinical signal to order a follow-up MCI Screen at 3&ndash;6 months and review modifiable risk factors.</div>
          </div>
        </div>

        <!-- All screens -->
        <div class="card">
          <div class="card-h">
            <div><h2>All screens</h2><div class="card-sub">Most recent on top</div></div>
            <a class="btn btn-ghost btn-sm" href="new-screen.html?patient=${p.id}">+ Order screen</a>
          </div>
          <div class="card-b">
            <div class="timeline">${tlHTML}</div>
          </div>
        </div>

      </div>

      <!-- RIGHT -->
      <div class="stack">

        <!-- Latest risk card -->
        <div class="card">
          <div class="card-h"><div><h2>Latest result</h2><div class="card-sub">${last ? formatDate(last.date) : '—'}</div></div></div>
          <div class="card-b">
            <div style="display:flex; align-items:flex-end; gap:14px; margin-bottom:8px;">
              <div style="font-family:var(--serif); font-size:50px; font-weight:700; color:var(--teal); line-height:0.9;">${last?.risk ?? '—'}</div>
              <div>
                <span class="pill ${cat.cls}" style="font-size:11px;">${cat.label}</span>
                <div class="text-small text-mute mt-1">Adjusted for age, sex &amp; education</div>
              </div>
            </div>
            <div class="riskbar" style="margin-top:14px;">
              <div class="marker" style="left:${(last?.risk ?? 0)}%;"></div>
            </div>
            <div class="riskbar-ticks" style="display:flex; justify-content:space-between; font-size:10px; color:var(--gray-mid); margin-top:8px;">
              <span>Low</span><span>Moderate</span><span>Elevated</span><span>High</span>
            </div>
            <div class="text-small mt-3">
              <b>Memory Performance Index:</b> <span class="num" style="color:var(--navy)">${last?.mpi ?? '—'}</span> / 100
            </div>
            <a href="report.html?id=${p.id}" class="btn btn-primary btn-sm mt-2" style="width:100%; justify-content:center; margin-top:14px;">Open full report &rarr;</a>
          </div>
        </div>

        <!-- Risk factors -->
        <div class="card">
          <div class="card-h"><div><h2>Risk factor profile</h2><div class="card-sub">From self-report + history</div></div></div>
          <div class="card-b">${rfHTML}</div>
        </div>

        <!-- Demographics -->
        <div class="card">
          <div class="card-h"><div><h2>Patient info</h2></div></div>
          <div class="card-b">
            <div class="info-grid">
              <div>
                <div class="k">Phone</div>
                <div class="v">${p.phone}</div>
              </div>
              <div>
                <div class="k">Email</div>
                <div class="v">${p.email}</div>
              </div>
              <div>
                <div class="k">Enrolled</div>
                <div class="v">${formatDate(p.enrolled)}</div>
              </div>
              <div>
                <div class="k">Provider</div>
                <div class="v">${p.physician}</div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  `;
})();
</script>
</body>
</html>
